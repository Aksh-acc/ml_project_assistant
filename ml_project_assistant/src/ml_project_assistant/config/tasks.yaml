task_assess_data :
  description :
    The user has not uploaded any specific data for this problem,but please go ahead and consider a hypothetical dataset that might be usefulfor their machine learning problem 
  agent:
    Data_Assessment_Agent
  expected_output :
    A hypothetical dataset that might be useful for the user's machine learning problem, along with any necessary preprocessing steps

task_recommend_model:
  description :
    Suggest suitable machine learning models for the defined problem and assessed data, providing rationale for each suggestion.
  agent:
    Model_Recommendation_Agent
  expected_output :
    A list of suitable machine learning models for the defined problem and assessed data, along with the rationale for each suggestion.
  
task_generate_code :
  description :
    Generate starter Python code tailored to the user's project using the model recommendation agent's recommendation(s), including snippets for package import, data handling, model definition, and training
  agent :
    Starter_Code_Generator_Agent
  expected_output:
    Python code snippets for package import, data handling, model definition, and training, tailored to the user's project, plus a brief summary of the problem and model recommendations.
            
  
