task_define_problem :
  description :
    Clarify and define the machine learning problem, 
    including identifying the problem type and specific requirements.
    Here is the user's problem:{ml_problem}
    """.format(ml_problem=user_question)
  agent :
   Problem_Definition_Agent
  expected_output:
    A clear and concise definition of the machine learning problem.
        

