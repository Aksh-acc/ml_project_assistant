[project]
name = "ml_project_assistant"
version = "0.1.0"
description = "ml_project_assistant using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "crewai[tools]>=0.108.0,<1.0.0"
]

[project.scripts]
ml_project_assistant = "ml_project_assistant.main:run"
run_crew = "ml_project_assistant.main:run"
train = "ml_project_assistant.main:train"
replay = "ml_project_assistant.main:replay"
test = "ml_project_assistant.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
